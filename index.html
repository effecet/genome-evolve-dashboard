<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SKILLGENOME</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha512-8Q6Y9XnTbOE+JNvjBQwJ2H8S+UV4uA6hiRykhdtIyDYZ2TprdNmWOUaKdGzOhyr4dCyk287OejbPvwl7lrfqrQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha512-MOCpqoRoisCTwJ8vQQiciZv0qcpROCidek3GTFS6KTk2+y7munJIlKCVkFCYY+p3ErYFXCjmFjnfTTRSC1OHWQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" integrity="sha512-ND11pbmp3M3Wldj90In1EUlHIt8T7O6FykizQ/yXrFjHtpX+D0SX+/IVeLjqAV91r/Lavq4BpWJIC0nUtw5Kvw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#2b2b2b;font-family:'Space Mono',monospace;}
  ::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#555;}
  textarea,input{font-family:'Space Mono',monospace!important;color:#c9c9c9!important;}
  input::placeholder,textarea::placeholder{color:#666!important;}
  .hov{transition:border-color 0.2s;}.hov:hover{border-color:#252525!important;}
  .navbtn{transition:all 0.15s;}.navbtn:hover{color:#c9c9c9!important;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes scan{0%,100%{opacity:.03;}50%{opacity:.06;}}
  .fu{animation:fadeUp 0.3s ease forwards;}
  .blink{animation:blink 1.2s infinite;}
</style>
</head>
<body>
<div id="root"></div>
<script src="lib/generate-cycle.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

// ── localStorage helpers ────────────────────────────────────────────────
function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) { console.error(e); }
}

// ── File bridge (Claude Code writes JSON, dashboard reads) ──────────────
async function fetchJson(path) {
  try {
    const r = await fetch(path + "?t=" + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

function importJsonFile() {
  return new Promise(resolve => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";
    input.onchange = async e => {
      const file = e.target.files[0];
      if (!file) { resolve(null); return; }
      try {
        const text = await file.text();
        resolve(JSON.parse(text));
      } catch { resolve(null); }
    };
    input.click();
  });
}

const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => new Date().toISOString().split("T")[0];

// ── Shared Components ───────────────────────────────────────────────────
function LevelBar({ level }) {
  const col = level >= 8 ? "#22d3ee" : level >= 5 ? "#f97316" : level >= 3 ? "#a3530a" : "#666";
  return (
    <div style={{ display:"flex", gap:2, alignItems:"center" }}>
      {Array.from({ length:10 },(_,i) => (
        <div key={i} style={{ width:7, height:6, borderRadius:1, background: i < level ? col : "#444", transition:"background 0.4s" }} />
      ))}
      <span style={{ marginLeft:5, fontSize:9, color:"#888" }}>Lv.{level}</span>
    </div>
  );
}

function Btn({ onClick, children, col, disabled, loading, sm }) {
  const c = col || "#f97316";
  const off = disabled || loading;
  return (
    <button onClick={onClick} disabled={off} style={{
      background:"transparent", border: "1px solid " + (off ? "#555" : c),
      color: off ? "#666" : c, padding: sm ? "5px 10px" : "8px 18px",
      fontSize: sm ? 9 : 10, cursor: off ? "not-allowed" : "pointer",
      borderRadius:3, letterSpacing:1, transition:"all 0.2s", fontFamily:"'Space Mono',monospace"
    }}>{loading ? "..." : children}</button>
  );
}

const inp = {
  width:"100%", background:"#303030", border:"1px solid #4a4a4a", color:"#c9c9c9",
  padding:"9px 12px", fontSize:11, borderRadius:3, outline:"none",
  fontFamily:"'Space Mono',monospace", lineHeight:1.5
};

const SL = ({ children }) => (
  <div style={{ fontSize:9, color:"#aaa", letterSpacing:3, marginBottom:18 }}>{"◈ "}{children}</div>
);

// ── Main App ─────────────────────────────────────────────────────────────
function SkillGenome() {
  const [view, setView] = useState("today");
  const [projects, setProjects] = useState([]);
  const [daily, setDaily] = useState(null);
  const [history, setHistory] = useState([]);
  const [activityLog, setActivityLog] = useState([]);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    (async () => {
      // Load projects from projects.json (source of truth)
      let p = load("sg:projects", []);
      const fileProjects = await fetchJson("./data/projects.json");
      if (fileProjects && Array.isArray(fileProjects)) {
        if (p.length === 0) {
          // First load — use file data directly
          p = fileProjects;
        } else {
          // Merge: file is source of truth for structure, localStorage has runtime state
          // Update levels from file if file has been modified by Claude Code
          p = mergeProjects(p, fileProjects);
        }
        save("sg:projects", p);
      }

      // Load session-log.json for activity feed
      const logData = await fetchJson("./data/session-log.json");
      if (logData && Array.isArray(logData.entries)) {
        setActivityLog(logData.entries);
      }

      const d = load("sg:daily:" + todayStr(), null);
      const h = load("sg:history", []);
      setProjects(p); setDaily(d); setHistory(h);
      setTimeout(() => setReady(true), 300);
    })();
  }, []);

  // Merge projects: prefer localStorage levels/history if assessed, otherwise use file levels
  function mergeProjects(local, file) {
    const localMap = {};
    local.forEach(p => {
      localMap[p.id] = {};
      p.skills.forEach(s => { localMap[p.id][s.id] = s; });
    });

    return file.map(fp => {
      const merged = { ...fp };
      merged.skills = fp.skills.map(fs => {
        const ls = localMap[fp.id]?.[fs.id];
        if (ls && ls.lastAssessed) {
          // localStorage has assessed data — keep it but allow file to override level if newer
          if (fs.lastAssessed && fs.lastAssessed > ls.lastAssessed) {
            return { ...fs }; // file is newer (Claude updated it)
          }
          return { ...ls }; // localStorage is newer (user assessed in dashboard)
        }
        return { ...fs }; // no local data, use file
      });
      return merged;
    });
  }

  const upProjects = p => { setProjects(p); save("sg:projects", p); };
  const upDaily = d => { setDaily(d); save("sg:daily:" + todayStr(), d); };
  const upHistory = h => { setHistory(h); save("sg:history", h); };

  const totalSkills = projects.reduce((s,p) => s + p.skills.length, 0);
  const avgLvl = totalSkills === 0 ? "—" :
    (projects.reduce((s,p) => s + p.skills.reduce((ss,sk) => ss+sk.level, 0), 0) / totalSkills).toFixed(1);
  const isToday = daily?.date === todayStr();
  const todayDone = isToday ? (daily.completed||[]).length : 0;
  const todayActivity = activityLog.filter(e => e.date === todayStr()).length;

  const nav = [
    {id:"today",label:"TODAY"},
    {id:"activity",label:"ACTIVITY"},
    {id:"projects",label:"PROJECTS"},
    {id:"log",label:"LOG SESSION"},
    {id:"evolution",label:"EVOLUTION"}
  ];

  return (
    <div style={{ background:"#2b2b2b", minHeight:"100vh", fontFamily:"'Space Mono',monospace", color:"#c9c9c9" }}>
      {/* Scanlines */}
      <div style={{ position:"fixed", inset:0, pointerEvents:"none", zIndex:0,
        backgroundImage:"repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.012) 2px,rgba(255,255,255,0.012) 4px)",
        animation:"scan 5s ease-in-out infinite" }} />
      {/* Grid */}
      <div style={{ position:"fixed", inset:0, pointerEvents:"none", zIndex:0,
        backgroundImage:"linear-gradient(#333 1px,transparent 1px),linear-gradient(90deg,#333 1px,transparent 1px)",
        backgroundSize:"44px 44px" }} />

      {/* Header */}
      <div style={{ position:"sticky", top:0, zIndex:50, borderBottom:"1px solid #444",
        background:"rgba(43,43,43,0.96)", backdropFilter:"blur(8px)",
        padding:"13px 28px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div style={{ display:"flex", alignItems:"center", gap:18 }}>
          <div>
            <span style={{ fontFamily:"'Syne',sans-serif", fontSize:14, fontWeight:900, color:"#f97316", letterSpacing:-0.5 }}>SKILL</span>
            <span style={{ fontFamily:"'Syne',sans-serif", fontSize:14, fontWeight:900, color:"#22d3ee", letterSpacing:-0.5 }}>GENOME</span>
          </div>
          <div style={{ width:1, height:16, background:"#444" }} />
          <div style={{ display:"flex", gap:14, fontSize:9, color:"#999" }}>
            <span><span style={{ color:"#aaa" }}>{projects.length}</span> projects</span>
            <span><span style={{ color:"#aaa" }}>{totalSkills}</span> skills</span>
            <span>avg <span style={{ color: avgLvl !== "—" ? "#f97316" : "#666" }}>{avgLvl}</span></span>
            {todayDone > 0 && <span style={{ color:"#22c55e" }}>{todayDone} done today</span>}
            {todayActivity > 0 && <span style={{ color:"#a78bfa" }}>{todayActivity} logged</span>}
          </div>
        </div>
        <nav style={{ display:"flex", gap:2 }}>
          {nav.map(n => {
            const active = view === n.id;
            return (
              <button key={n.id} className="navbtn" onClick={() => setView(n.id)} style={{
                background: active ? "#3a3a3a" : "transparent",
                border: active ? "1px solid #555" : "1px solid transparent",
                color: active ? "#f97316" : "#888",
                padding:"5px 14px", fontSize:9, cursor:"pointer", borderRadius:3, letterSpacing:1.5
              }}>{n.label}</button>
            );
          })}
        </nav>
      </div>

      <div style={{ position:"relative", zIndex:1, padding:"36px 28px", maxWidth:980, margin:"0 auto" }}>
        {!ready ? (
          <div style={{ textAlign:"center", paddingTop:100, color:"#888", fontSize:11, letterSpacing:2 }}>
            LOADING GENOME<span className="blink">_</span>
          </div>
        ) : (
          <>
            {view==="today" && <TodayView projects={projects} daily={daily} upDaily={upDaily} />}
            {view==="activity" && <ActivityView log={activityLog} />}
            {view==="projects" && <ProjectsView projects={projects} upProjects={upProjects} />}
            {view==="log" && <LogView projects={projects} daily={daily} upProjects={upProjects} upHistory={upHistory} history={history} />}
            {view==="evolution" && <EvoView projects={projects} history={history} />}
          </>
        )}
      </div>

      {/* Footer */}
      <div style={{ textAlign:"center", padding:"20px 0 30px", fontSize:8, color:"#555", letterSpacing:2 }}>
        POWERED BY CLAUDE CODE — AUTO-TRACKED VIA HOOKS
      </div>
    </div>
  );
}

// ── ACTIVITY (new — shows session-log.json) ──────────────────────────────
function ActivityView({ log }) {
  const byDate = log.reduce((acc, e) => {
    if (!acc[e.date]) acc[e.date] = [];
    acc[e.date].push(e);
    return acc;
  }, {});
  const dates = Object.keys(byDate).sort().reverse();

  // Category color map
  const catCol = {
    "Creative": "#a78bfa",
    "Data": "#22d3ee",
    "Engineering": "#f97316",
    "AI Engineering": "#ec4899",
    "Research": "#34d399",
    "Documentation": "#fbbf24",
    "Tooling": "#94a3b8",
    "Writing": "#fb923c",
    "General": "#888"
  };

  // Stats
  const today = todayStr();
  const todayEntries = byDate[today] || [];
  const allCategories = log.reduce((acc, e) => { acc[e.category] = (acc[e.category]||0) + 1; return acc; }, {});
  const topCat = Object.entries(allCategories).sort((a,b) => b[1]-a[1]);
  const uniqueDomains = new Set(log.map(e => e.domain)).size;

  return (
    <div className="fu">
      <SL>ACTIVITY FEED — AUTO-TRACKED</SL>

      {/* Stats row */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:10, marginBottom:30 }}>
        <div style={{ border:"1px solid #444", borderRadius:6, padding:"14px 16px", textAlign:"center" }}>
          <div style={{ fontFamily:"'Syne',sans-serif", fontSize:24, fontWeight:900, color:"#f97316" }}>{log.length}</div>
          <div style={{ fontSize:8, color:"#888", letterSpacing:2, marginTop:4 }}>TOTAL LOGS</div>
        </div>
        <div style={{ border:"1px solid #444", borderRadius:6, padding:"14px 16px", textAlign:"center" }}>
          <div style={{ fontFamily:"'Syne',sans-serif", fontSize:24, fontWeight:900, color:"#22d3ee" }}>{todayEntries.length}</div>
          <div style={{ fontSize:8, color:"#888", letterSpacing:2, marginTop:4 }}>TODAY</div>
        </div>
        <div style={{ border:"1px solid #444", borderRadius:6, padding:"14px 16px", textAlign:"center" }}>
          <div style={{ fontFamily:"'Syne',sans-serif", fontSize:24, fontWeight:900, color:"#a78bfa" }}>{uniqueDomains}</div>
          <div style={{ fontSize:8, color:"#888", letterSpacing:2, marginTop:4 }}>DOMAINS</div>
        </div>
        <div style={{ border:"1px solid #444", borderRadius:6, padding:"14px 16px", textAlign:"center" }}>
          <div style={{ fontFamily:"'Syne',sans-serif", fontSize:24, fontWeight:900, color:"#22c55e" }}>{dates.length}</div>
          <div style={{ fontSize:8, color:"#888", letterSpacing:2, marginTop:4 }}>ACTIVE DAYS</div>
        </div>
      </div>

      {/* Category breakdown */}
      {topCat.length > 0 && (
        <div style={{ marginBottom:30 }}>
          <div style={{ fontSize:9, color:"#888", letterSpacing:2, marginBottom:12 }}>CATEGORY BREAKDOWN</div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            {topCat.map(([cat, count]) => (
              <div key={cat} style={{ border:"1px solid #444", borderRadius:4, padding:"6px 12px",
                display:"flex", alignItems:"center", gap:8 }}>
                <div style={{ width:8, height:8, borderRadius:2, background: catCol[cat] || "#888" }} />
                <span style={{ fontSize:10, color:"#ccc" }}>{cat}</span>
                <span style={{ fontSize:10, color: catCol[cat] || "#888", fontWeight:"bold" }}>{count}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Timeline */}
      {dates.length === 0 ? (
        <div style={{ textAlign:"center", padding:"60px 40px", border:"1px dashed #555", borderRadius:7, color:"#777", fontSize:10 }}>
          No activity logged yet. Use skills in Claude Code — the hook auto-logs them here.
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
          {dates.map(date => (
            <div key={date}>
              <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:10 }}>
                <span style={{ fontSize:9, color:"#999" }}>{date === today ? "TODAY" : date}</span>
                <div style={{ flex:1, height:1, background:"#3a3a3a" }} />
                <span style={{ fontSize:9, color:"#777" }}>{byDate[date].length} entries</span>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                {byDate[date].map((e, i) => (
                  <div key={i} style={{ display:"flex", alignItems:"center", gap:14, padding:"10px 16px",
                    background:"#333", border:"1px solid #444", borderRadius:5 }}>
                    <div style={{ width:8, height:8, borderRadius:2, background: catCol[e.category] || "#888", flexShrink:0 }} />
                    <div style={{ minWidth:40, fontSize:9, color:"#777" }}>{e.time}</div>
                    <div style={{ flex:1 }}>
                      <span style={{ fontSize:11, fontWeight:"bold", color:"#e0e0e0" }}>{e.domain}</span>
                      {e.context && <span style={{ fontSize:10, color:"#888", marginLeft:8 }}>— {e.context}</span>}
                    </div>
                    <div style={{ fontSize:8, color: catCol[e.category] || "#888", background:"rgba(255,255,255,0.04)",
                      padding:"3px 8px", borderRadius:2, letterSpacing:1 }}>{e.category.toUpperCase()}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Refresh hint */}
      <div style={{ textAlign:"center", marginTop:24, fontSize:9, color:"#555" }}>
        Refresh page to load latest activity from session-log.json
      </div>
    </div>
  );
}

// ── TODAY ─────────────────────────────────────────────────────────────────
function TodayView({ projects, daily, upDaily }) {
  const [loading, setLoading] = useState(false);
  const [suggested, setSuggested] = useState(null);
  const [pendingSel, setPendingSel] = useState([]);
  const [confirmMode, setConfirmMode] = useState(false);
  const [error, setError] = useState(null);

  const allSkills = projects.flatMap(p => p.skills.map(s => ({...s, projectId:p.id, projectName:p.name})));
  const isToday = daily?.date === todayStr();
  const confirmed = isToday ? (daily.confirmed||[]) : [];
  const completed = isToday ? (daily.completed||[]) : [];

  const getSkill = (sid,pid) => projects.find(p=>p.id===pid)?.skills.find(s=>s.id===sid);
  const getProject = pid => projects.find(p=>p.id===pid);

  // Auto-load daily cycle on mount if not already confirmed
  useEffect(() => {
    if (isToday && confirmed.length > 0) return; // already confirmed
    (async () => {
      // Priority 1: Claude Code–generated file (AI-curated)
      const data = await fetchJson("./data/daily-cycle.json");
      if (data && data.date === todayStr() && Array.isArray(data.skills) && data.skills.length > 0) {
        upDaily({ date:todayStr(), confirmed:data.skills, completed:[], assessmentDone:false });
        return;
      }
      // Priority 2: client-side auto-generate (blended scoring)
      if (typeof generateCycle === "function" && projects.length > 0) {
        const cycle = generateCycle(projects, { date: todayStr() });
        if (cycle.skills.length > 0) {
          upDaily({ date:todayStr(), confirmed:cycle.skills, completed:[], assessmentDone:false });
        }
      }
    })();
  }, []);

  const loadCycle = async () => {
    setLoading(true); setError(null);
    let data = await fetchJson("./data/daily-cycle.json");
    if (!data) {
      data = await importJsonFile();
    }
    // Fallback: generate client-side
    if ((!data || !Array.isArray(data.skills) || data.skills.length === 0)
        && typeof generateCycle === "function" && projects.length > 0) {
      data = generateCycle(projects, { date: todayStr() });
    }
    setLoading(false);
    if (!data || !Array.isArray(data.skills) || data.skills.length === 0) {
      setError("No skills to generate a cycle from. Add projects first.");
      return;
    }
    setSuggested(data.skills);
    setPendingSel(data.skills.map(r => r.skillId));
    setConfirmMode(true);
  };

  const confirm = () => {
    const final = suggested.filter(s => pendingSel.includes(s.skillId));
    upDaily({ date:todayStr(), confirmed:final, completed:[], assessmentDone:false });
    setConfirmMode(false); setSuggested(null);
  };

  const toggleComplete = skillId => {
    if (!isToday) return;
    const nc = completed.includes(skillId) ? completed.filter(id => id !== skillId) : [...completed, skillId];
    upDaily({ ...daily, completed:nc });
  };

  if (confirmMode && suggested) return (
    <div className="fu">
      <SL>CONFIRM TODAY'S CYCLE</SL>
      <p style={{ fontSize:10, color:"#999", marginBottom:24 }}>Toggle to include or exclude. Confirm when ready (need 5).</p>
      <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:24 }}>
        {suggested.map((s,i) => {
          const skill = getSkill(s.skillId, s.projectId);
          const proj = getProject(s.projectId);
          const active = pendingSel.includes(s.skillId);
          return (
            <div key={s.skillId} onClick={() => setPendingSel(prev => active ? prev.filter(id => id !== s.skillId) : [...prev, s.skillId])}
              style={{ border: "1px solid " + (active ? "#f97316" : "#444"), borderRadius:6, padding:"14px 18px",
                cursor:"pointer", transition:"all 0.2s", background: active ? "rgba(249,115,22,0.06)" : "#333",
                display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
                  <span style={{ fontSize:9, color:"#999" }}>#{i+1}</span>
                  <span style={{ fontSize:12, fontWeight:"bold", color: active ? "#e0e0e0" : "#999" }}>{skill?.name}</span>
                  <span style={{ fontSize:8, color:"#f97316", background:"rgba(249,115,22,0.07)", padding:"2px 7px", borderRadius:2 }}>
                    {proj?.name?.slice(0,22)}
                  </span>
                </div>
                <div style={{ fontSize:10, color:"#999" }}>{s.reason}</div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:6, marginLeft:16 }}>
                <LevelBar level={skill?.level||1} />
                <span style={{ fontSize:9, color: active ? "#f97316" : "#888" }}>{active ? "✓ IN" : "○ OUT"}</span>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ display:"flex", gap:10 }}>
        <Btn onClick={confirm} disabled={pendingSel.length !== 5} col="#f97316">CONFIRM {pendingSel.length}/5</Btn>
        <Btn onClick={() => { setConfirmMode(false); setSuggested(null); }} col="#333">CANCEL</Btn>
      </div>
    </div>
  );

  if (projects.length === 0) return (
    <div className="fu" style={{ textAlign:"center", paddingTop:90 }}>
      <div style={{ fontFamily:"'Syne',sans-serif", fontSize:28, fontWeight:900, color:"#777", marginBottom:12 }}>NO GENOME YET</div>
      <p style={{ color:"#999", fontSize:11 }}>Go to PROJECTS and add your first project to seed the skill genome.</p>
    </div>
  );

  const dateLabel = new Date().toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"});

  return (
    <div className="fu">
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:34 }}>
        <div>
          <SL>TODAY'S PRACTICE CYCLE</SL>
          <div style={{ fontFamily:"'Syne',sans-serif", fontSize:24, fontWeight:900, color:"#e0e0e0", letterSpacing:-1 }}>{dateLabel}</div>
          {isToday && confirmed.length > 0 && (
            <div style={{ fontSize:10, color:"#999", marginTop:6 }}>
              {completed.length}/{confirmed.length} completed
              {completed.length === confirmed.length && <span style={{ color:"#22c55e", marginLeft:8 }}>✓ cycle complete</span>}
            </div>
          )}
        </div>
        {(!isToday || confirmed.length === 0) && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:6 }}>
            <Btn onClick={loadCycle} loading={loading} col="#f97316">
              {loading ? "LOADING..." : "↻ LOAD TODAY'S 5"}
            </Btn>
            {error && <div style={{ fontSize:9, color:"#ef4444", maxWidth:340, textAlign:"right" }}>{error}</div>}
          </div>
        )}
      </div>

      {isToday && confirmed.length > 0 ? (
        <>
          <div style={{ display:"flex", gap:3, marginBottom:26 }}>
            {confirmed.map(s => (
              <div key={s.skillId} style={{ flex:1, height:3, borderRadius:2,
                background: completed.includes(s.skillId) ? "#22c55e" : "#555", transition:"background 0.4s" }} />
            ))}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {confirmed.map((s,i) => {
              const skill = getSkill(s.skillId, s.projectId);
              const proj = getProject(s.projectId);
              const done = completed.includes(s.skillId);
              if (!skill) return null;
              return (
                <div key={s.skillId} className="hov" onClick={() => toggleComplete(s.skillId)} style={{
                  border: "1px solid " + (done ? "#14532d" : "#444"), borderRadius:7, padding:"18px 20px",
                  cursor:"pointer", background: done ? "rgba(34,197,94,0.04)" : "#333", position:"relative", overflow:"hidden"
                }}>
                  {done && <div style={{ position:"absolute", top:0, left:0, right:0, height:2,
                    background:"linear-gradient(90deg,#22c55e,transparent)" }} />}
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
                    <span style={{ fontSize:9, color: done ? "#22c55e" : "#888" }}>
                      {done ? "✓ DONE" : "SKILL " + (i+1) + " OF " + confirmed.length}
                    </span>
                    <span style={{ fontSize:8, color:"#f97316", background:"rgba(249,115,22,0.07)", padding:"2px 8px", borderRadius:2 }}>
                      {proj?.name?.slice(0,20)}
                    </span>
                  </div>
                  <div style={{ fontSize:13, fontWeight:"bold", color: done ? "#666" : "#e0e0e0", marginBottom:8, lineHeight:1.35 }}>
                    {skill.name}
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <LevelBar level={skill.level} />
                    <span style={{ fontSize:9, color:"#888" }}>{skill.category}</span>
                  </div>
                  {skill.history?.length > 0 && (
                    <div style={{ marginTop:8, fontSize:9, color:"#888", fontStyle:"italic" }}>
                      {"→ "}{skill.history[skill.history.length-1]?.tip?.slice(0,55) || "—"}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </>
      ) : (
        <div style={{ border:"1px dashed #555", borderRadius:8, padding:"60px 40px", textAlign:"center" }}>
          <div style={{ fontFamily:"'Syne',sans-serif", fontSize:24, fontWeight:900, color:"#666", marginBottom:12 }}>GENOME IDLE</div>
          <p style={{ color:"#888", fontSize:11, lineHeight:1.7 }}>
            Auto-generating today's cycle...
            <br/>If nothing loads, click "Load Today's 5" or serve via <span style={{ color:"#f97316" }}>make serve</span>.
          </p>
        </div>
      )}
    </div>
  );
}

// ── PROJECTS ──────────────────────────────────────────────────────────────
function ProjectsView({ projects, upProjects }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const [desc, setDesc] = useState("");
  const [expanded, setExpanded] = useState(null);
  const [newSkills, setNewSkills] = useState([{name:"",category:"",level:1}]);
  const [addingSkillTo, setAddingSkillTo] = useState(null);
  const [inlineSkill, setInlineSkill] = useState({name:"",category:"",level:1});

  const createProject = () => {
    if (!name.trim()) return;
    const skills = newSkills.filter(s => s.name.trim()).map(s => ({
      id:"sk_" + uid(), name:s.name.trim(), category:s.category.trim()||"General",
      level:Math.min(10,Math.max(1,parseInt(s.level)||1)),
      lastAssessed:null, history:[]
    }));
    const proj = { id:"proj_" + uid(), name:name.trim(), description:desc.trim(), createdAt:todayStr(), skills };
    upProjects([...projects, proj]);
    setName(""); setDesc(""); setNewSkills([{name:"",category:"",level:1}]); setAdding(false); setExpanded(proj.id);
  };

  const importProject = async () => {
    const data = await importJsonFile();
    if (!data) return;
    const proj = {
      id: data.id || "proj_" + uid(),
      name: data.name || "Imported Project",
      description: data.description || "",
      createdAt: data.createdAt || todayStr(),
      skills: (data.skills || []).map(s => ({
        id: s.id || "sk_" + uid(), name: s.name, category: s.category || "General",
        level: Math.min(10, Math.max(1, s.level || 1)),
        lastAssessed: s.lastAssessed || null, history: s.history || []
      }))
    };
    upProjects([...projects, proj]);
    setExpanded(proj.id);
  };

  const deleteProject = id => upProjects(projects.filter(p => p.id !== id));

  const addSkillToProject = (projId) => {
    if (!inlineSkill.name.trim()) return;
    const updated = projects.map(p => {
      if (p.id !== projId) return p;
      return { ...p, skills: [...p.skills, {
        id:"sk_" + uid(), name:inlineSkill.name.trim(), category:inlineSkill.category.trim()||"General",
        level:Math.min(10,Math.max(1,parseInt(inlineSkill.level)||1)),
        lastAssessed:null, history:[]
      }]};
    });
    upProjects(updated);
    setInlineSkill({name:"",category:"",level:1});
    setAddingSkillTo(null);
  };

  const deleteSkill = (projId, skillId) => {
    const updated = projects.map(p => {
      if (p.id !== projId) return p;
      return { ...p, skills: p.skills.filter(s => s.id !== skillId) };
    });
    upProjects(updated);
  };

  const updateNewSkill = (idx, field, val) => {
    const ns = [...newSkills];
    ns[idx] = { ...ns[idx], [field]: val };
    setNewSkills(ns);
  };

  return (
    <div className="fu">
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:24 }}>
        <SL>PROJECT SKILL TREES</SL>
        <div style={{ display:"flex", gap:8 }}>
          <Btn onClick={importProject} col="#888" sm>IMPORT JSON</Btn>
          <Btn onClick={() => setAdding(!adding)} col="#22d3ee">+ NEW PROJECT</Btn>
        </div>
      </div>

      {adding && (
        <div className="fu" style={{ border:"1px solid #22d3ee", borderRadius:7, padding:22, marginBottom:24, background:"rgba(34,211,238,0.02)" }}>
          <div style={{ fontSize:9, color:"#22d3ee", letterSpacing:3, marginBottom:16 }}>{"◈ NEW PROJECT"}</div>
          <input value={name} onChange={e => setName(e.target.value)}
            placeholder="Project name" style={inp} />
          <textarea value={desc} onChange={e => setDesc(e.target.value)}
            placeholder="Description (optional)"
            rows={2} style={{ ...inp, marginTop:8, resize:"vertical" }} />

          <div style={{ marginTop:16, fontSize:9, color:"#888", letterSpacing:2, marginBottom:10 }}>SKILLS</div>
          {newSkills.map((s, i) => (
            <div key={i} style={{ display:"flex", gap:6, marginBottom:6 }}>
              <input value={s.name} onChange={e => updateNewSkill(i, "name", e.target.value)}
                placeholder="Skill name" style={{ ...inp, flex:3 }} />
              <input value={s.category} onChange={e => updateNewSkill(i, "category", e.target.value)}
                placeholder="Category" style={{ ...inp, flex:1.5 }} />
              <input type="number" value={s.level} min={1} max={10}
                onChange={e => updateNewSkill(i, "level", e.target.value)}
                style={{ ...inp, flex:0.5, textAlign:"center" }} />
              {newSkills.length > 1 && (
                <button onClick={() => setNewSkills(newSkills.filter((_,j) => j !== i))}
                  style={{ background:"transparent", border:"none", color:"#cc4444", cursor:"pointer", fontSize:14, padding:"0 4px" }}>×</button>
              )}
            </div>
          ))}
          <button onClick={() => setNewSkills([...newSkills, {name:"",category:"",level:1}])}
            style={{ background:"transparent", border:"1px dashed #555", color:"#888", padding:"6px 12px",
              fontSize:9, cursor:"pointer", borderRadius:3, marginTop:4, width:"100%", fontFamily:"'Space Mono',monospace" }}>
            + ADD SKILL ROW
          </button>

          <div style={{ display:"flex", gap:8, marginTop:14 }}>
            <Btn onClick={createProject} disabled={!name.trim()} col="#22d3ee">CREATE PROJECT</Btn>
            <Btn onClick={() => setAdding(false)} col="#333">CANCEL</Btn>
          </div>
        </div>
      )}

      {projects.length === 0 && !adding && (
        <div style={{ textAlign:"center", padding:"60px 40px", border:"1px dashed #555", borderRadius:7, color:"#777", fontSize:11 }}>
          No projects yet. Add one to seed your first skill tree.
        </div>
      )}

      {projects.map(p => {
        const avgLv = p.skills.length ? (p.skills.reduce((s,sk) => s + sk.level, 0) / p.skills.length).toFixed(1) : "—";
        const open = expanded === p.id;
        return (
          <div key={p.id} className="hov" style={{ border:"1px solid #444", borderRadius:7, marginBottom:10, overflow:"hidden" }}>
            <div onClick={() => setExpanded(open ? null : p.id)} style={{
              display:"flex", justifyContent:"space-between", alignItems:"center",
              padding:"16px 20px", cursor:"pointer", background: open ? "#383838" : "#333" }}>
              <div>
                <div style={{ fontSize:13, fontWeight:"bold", color:"#e0e0e0", marginBottom:3 }}>{p.name}</div>
                <div style={{ fontSize:9, color:"#999" }}>{p.skills.length} skills · created {p.createdAt}</div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:20 }}>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontSize:9, color:"#888" }}>avg level</div>
                  <div style={{ fontFamily:"'Syne',sans-serif", fontSize:20, fontWeight:900, color:"#f97316" }}>{avgLv}</div>
                </div>
                <span style={{ color:"#888", fontSize:10 }}>{open ? "▲" : "▼"}</span>
              </div>
            </div>
            {open && (
              <div className="fu" style={{ padding:"4px 20px 20px", borderTop:"1px solid #444" }}>
                {p.description && <p style={{ fontSize:10, color:"#999", margin:"12px 0 16px" }}>{p.description}</p>}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
                  {p.skills.map(s => (
                    <div key={s.id} className="hov" style={{ border:"1px solid #444", borderRadius:5, padding:"12px 14px", position:"relative" }}>
                      <div style={{ fontSize:11, fontWeight:"bold", color:"#c9c9c9", marginBottom:4, lineHeight:1.3 }}>{s.name}</div>
                      <div style={{ fontSize:8, color:"#999", marginBottom:8 }}>{s.category}</div>
                      <LevelBar level={s.level} />
                      {s.lastAssessed && <div style={{ fontSize:8, color:"#777", marginTop:5 }}>assessed {s.lastAssessed}</div>}
                      <span onClick={(e) => { e.stopPropagation(); deleteSkill(p.id, s.id); }}
                        style={{ position:"absolute", top:6, right:8, fontSize:10, color:"#666", cursor:"pointer" }}
                        title="Remove skill">×</span>
                    </div>
                  ))}
                </div>

                {addingSkillTo === p.id ? (
                  <div style={{ display:"flex", gap:6, marginTop:12, alignItems:"center" }}>
                    <input value={inlineSkill.name} onChange={e => setInlineSkill({...inlineSkill, name:e.target.value})}
                      placeholder="Skill name" style={{ ...inp, flex:3 }} />
                    <input value={inlineSkill.category} onChange={e => setInlineSkill({...inlineSkill, category:e.target.value})}
                      placeholder="Category" style={{ ...inp, flex:1.5 }} />
                    <input type="number" value={inlineSkill.level} min={1} max={10}
                      onChange={e => setInlineSkill({...inlineSkill, level:e.target.value})}
                      style={{ ...inp, flex:0.5, textAlign:"center" }} />
                    <Btn onClick={() => addSkillToProject(p.id)} col="#22c55e" sm>ADD</Btn>
                    <Btn onClick={() => setAddingSkillTo(null)} col="#333" sm>×</Btn>
                  </div>
                ) : (
                  <div style={{ marginTop:14, display:"flex", justifyContent:"space-between" }}>
                    <span onClick={() => { setAddingSkillTo(p.id); setInlineSkill({name:"",category:"",level:1}); }}
                      style={{ fontSize:9, color:"#22d3ee", cursor:"pointer", letterSpacing:1 }}>
                      + ADD SKILL
                    </span>
                    <span onClick={() => deleteProject(p.id)} style={{ fontSize:9, color:"#cc4444", cursor:"pointer", letterSpacing:1 }}>
                      ✕ DELETE PROJECT
                    </span>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── LOG SESSION ───────────────────────────────────────────────────────────
function LogView({ projects, daily, upProjects, upHistory, history }) {
  const [step, setStep] = useState("pick");
  const [selected, setSelected] = useState([]);
  const [logs, setLogs] = useState({});
  const [deltas, setDeltas] = useState({});
  const [saving, setSaving] = useState(false);

  const allSkills = projects.flatMap(p => p.skills.map(s => ({...s, projectId:p.id, projectName:p.name})));
  const isToday = daily?.date === todayStr();

  useEffect(() => {
    if (step === "pick" && isToday && (daily.confirmed||[]).length > 0)
      setSelected((daily.confirmed||[]).map(c => c.skillId));
  }, []);

  const toggle = id => setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  const upLog = (id, field, val) => setLogs(prev => ({...prev, [id]: {...prev[id], [field]:val}}));
  const upDelta = (id, val) => setDeltas(prev => ({...prev, [id]: val}));

  const startLog = () => {
    const init = {};
    const initDeltas = {};
    selected.forEach(id => {
      init[id] = {status:"used", learned:"", enhance:""};
      initDeltas[id] = 0;
    });
    setLogs(init); setDeltas(initDeltas); setStep("log");
  };

  const importAssessment = async () => {
    let data = await fetchJson("./data/session-assessment.json");
    if (!data) data = await importJsonFile();
    if (data && Array.isArray(data.updates)) {
      const nd = {...deltas};
      data.updates.forEach(u => {
        if (nd.hasOwnProperty(u.skillId)) nd[u.skillId] = u.delta || 0;
      });
      setDeltas(nd);
      setImportedTips(data.updates.reduce((acc,u) => { acc[u.skillId] = u.tip || ""; return acc; }, {}));
    }
  };

  const [importedTips, setImportedTips] = useState({});

  const goToReview = () => {
    const nd = {...deltas};
    selected.forEach(id => {
      const lg = logs[id];
      if (nd[id] === 0 && lg) {
        if (lg.status === "skipped") nd[id] = -1;
        else if (lg.status === "used" && lg.learned && lg.learned.length > 30) nd[id] = 1;
      }
    });
    setDeltas(nd);
    setStep("review");
  };

  const apply = () => {
    setSaving(true);
    const today = todayStr();
    const newHistory = [...history];
    const updatedProjects = projects.map(proj => ({
      ...proj,
      skills: proj.skills.map(sk => {
        if (!selected.includes(sk.id)) return sk;
        const delta = deltas[sk.id] || 0;
        const lg = logs[sk.id];
        const tip = importedTips[sk.id] || "";
        const newLv = Math.min(10, Math.max(1, sk.level + delta));
        newHistory.push({
          date:today, projectId:proj.id, skillId:sk.id, skillName:sk.name, projectName:proj.name,
          status:lg?.status, learned:lg?.learned||"", tip, levelBefore:sk.level, levelAfter:newLv
        });
        return {...sk, level:newLv, lastAssessed:today,
          history:[...(sk.history||[]), {date:today, status:lg?.status, learned:lg?.learned, tip, levelBefore:sk.level, levelAfter:newLv}]};
      })
    }));
    upProjects(updatedProjects);
    upHistory(newHistory);
    setSaving(false); setStep("done");
  };

  if (step === "done") return (
    <div className="fu" style={{ textAlign:"center", paddingTop:80 }}>
      <div style={{ fontFamily:"'Syne',sans-serif", fontSize:30, fontWeight:900, color:"#22c55e", marginBottom:10 }}>GENOME UPDATED</div>
      <p style={{ color:"#999", fontSize:11 }}>Session logged. Skills evolved.</p>
      <div style={{ marginTop:24 }}>
        <Btn onClick={() => setStep("pick")} col="#888" sm>log another session</Btn>
      </div>
    </div>
  );

  if (step === "review") return (
    <div className="fu">
      <SL>REVIEW — SET LEVEL DELTAS</SL>
      <p style={{ fontSize:10, color:"#999", marginBottom:10 }}>
        Set each skill's delta manually, or import an AI assessment from Claude Code.
      </p>
      <div style={{ marginBottom:20 }}>
        <Btn onClick={importAssessment} col="#22d3ee" sm>IMPORT AI ASSESSMENT</Btn>
      </div>

      <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:24 }}>
        {selected.map(id => {
          const sk = allSkills.find(s => s.id === id);
          const delta = deltas[id] || 0;
          const newLv = Math.min(10, Math.max(1, (sk?.level||1) + delta));
          const col = delta > 0 ? "#22c55e" : delta < 0 ? "#ef4444" : "#888";
          const tip = importedTips[id];
          return (
            <div key={id} style={{ border:"1px solid #444", borderRadius:6, padding:"16px 20px", display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:12, fontWeight:"bold", marginBottom:2 }}>{sk?.name}</div>
                <div style={{ fontSize:9, color:"#f97316", marginBottom:8 }}>{sk?.projectName}</div>
                <div style={{ fontSize:9, color:"#777", marginBottom:6 }}>
                  {logs[id]?.status === "used" ? "✓ used" : logs[id]?.status === "studied" ? "◈ studied" : "— skipped"}
                  {logs[id]?.learned && <span style={{ color:"#999" }}>{" · "}{logs[id].learned.slice(0,60)}</span>}
                </div>
                {tip && <div style={{ fontSize:10, color:"#22d3ee" }}>{"→ "}{tip}</div>}
                <div style={{ display:"flex", gap:4, marginTop:8 }}>
                  {[-1, 0, 1, 2].map(d => {
                    const active = delta === d;
                    const btnCol = d > 0 ? "#22c55e" : d < 0 ? "#ef4444" : "#888";
                    return (
                      <button key={d} onClick={() => upDelta(id, d)} style={{
                        padding:"4px 12px", fontSize:10, fontWeight:"bold",
                        border: "1px solid " + (active ? btnCol : "#444"),
                        borderRadius:3, cursor:"pointer",
                        background: active ? btnCol + "22" : "transparent",
                        color: active ? btnCol : "#777",
                        fontFamily:"'Space Mono',monospace"
                      }}>{d > 0 ? "+" + d : d === 0 ? "±0" : d}</button>
                    );
                  })}
                </div>
              </div>
              <div style={{ textAlign:"right", marginLeft:20, minWidth:60 }}>
                <div style={{ fontSize:10, color:"#999" }}>{sk?.level} →</div>
                <div style={{ fontFamily:"'Syne',sans-serif", fontSize:26, fontWeight:900, color:col }}>{newLv}</div>
                <div style={{ fontSize:10, color:col }}>{delta > 0 ? "+" + delta : delta === 0 ? "±0" : delta}</div>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ display:"flex", gap:10 }}>
        <Btn onClick={apply} loading={saving} col="#22c55e">APPLY UPDATES</Btn>
        <Btn onClick={() => setStep("log")} col="#333">{"← EDIT NOTES"}</Btn>
      </div>
    </div>
  );

  if (step === "log") return (
    <div className="fu">
      <SL>SESSION NOTES</SL>
      <p style={{ fontSize:10, color:"#999", marginBottom:22 }}>Status + what you learned + what to focus on next.</p>
      <div style={{ display:"flex", flexDirection:"column", gap:14, marginBottom:24 }}>
        {selected.map(id => {
          const sk = allSkills.find(s => s.id === id);
          const lg = logs[id] || {};
          return (
            <div key={id} style={{ border:"1px solid #444", borderRadius:7, padding:"16px 20px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                <div>
                  <div style={{ fontSize:12, fontWeight:"bold" }}>{sk?.name}</div>
                  <div style={{ fontSize:9, color:"#999", marginTop:2 }}>{sk?.projectName} · Lv.{sk?.level}</div>
                </div>
                <div style={{ display:"flex", gap:5 }}>
                  {[["used","#22c55e"],["studied","#22d3ee"],["skipped","#ef4444"]].map(([t,c]) => {
                    const active = lg.status === t;
                    return (
                      <button key={t} onClick={() => upLog(id,"status",t)} style={{
                        padding:"4px 10px", fontSize:8, border: "1px solid " + (active ? c : "#444"),
                        borderRadius:2, cursor:"pointer", background: active ? c + "11" : "transparent",
                        color: active ? c : "#999", letterSpacing:1, fontFamily:"'Space Mono',monospace"
                      }}>{t.toUpperCase()}</button>
                    );
                  })}
                </div>
              </div>
              <textarea value={lg.learned||""} onChange={e => upLog(id,"learned",e.target.value)}
                placeholder="What did I learn, discover, or understand better?" rows={2}
                style={{ ...inp, marginBottom:8, resize:"none" }} />
              <textarea value={lg.enhance||""} onChange={e => upLog(id,"enhance",e.target.value)}
                placeholder="What should I focus on or improve next time?" rows={2}
                style={{ ...inp, resize:"none" }} />
            </div>
          );
        })}
      </div>
      <div style={{ display:"flex", gap:10 }}>
        <Btn onClick={goToReview} col="#f97316">{"→ REVIEW & SCORE"}</Btn>
        <Btn onClick={() => setStep("pick")} col="#333">{"← BACK"}</Btn>
      </div>
    </div>
  );

  return (
    <div className="fu">
      <SL>SELECT SKILLS WORKED ON</SL>
      <p style={{ fontSize:10, color:"#999", marginBottom:22 }}>
        {isToday && (daily.confirmed||[]).length > 0
          ? "Today's confirmed cycle pre-selected. Adjust if needed."
          : "Pick the skills you touched in this session."}
      </p>
      {projects.map(proj => (
        <div key={proj.id} style={{ marginBottom:22 }}>
          <div style={{ fontSize:9, color:"#f97316", letterSpacing:2, marginBottom:10 }}>{proj.name.toUpperCase()}</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6 }}>
            {proj.skills.map(s => {
              const active = selected.includes(s.id);
              return (
                <div key={s.id} className="hov" onClick={() => toggle(s.id)} style={{
                  border: "1px solid " + (active ? "#f97316" : "#444"), borderRadius:5, padding:"10px 12px",
                  cursor:"pointer", background: active ? "rgba(249,115,22,0.08)" : "transparent", transition:"all 0.15s"
                }}>
                  <div style={{ fontSize:11, color: active ? "#e0e0e0" : "#999", marginBottom:5, lineHeight:1.3 }}>{s.name}</div>
                  <LevelBar level={s.level} />
                </div>
              );
            })}
          </div>
        </div>
      ))}
      {selected.length > 0 && (
        <div style={{ marginTop:8 }}>
          <Btn onClick={startLog} col="#f97316">LOG {selected.length} SKILL{selected.length > 1 ? "S" : ""} →</Btn>
        </div>
      )}
    </div>
  );
}

// ── EVOLUTION ─────────────────────────────────────────────────────────────
function EvoView({ projects, history }) {
  const allSkills = projects.flatMap(p => p.skills.map(s => ({...s, projectId:p.id, projectName:p.name})));
  const sorted = [...allSkills].sort((a,b) => b.level - a.level);
  const byDate = history.reduce((acc,h) => { if(!acc[h.date]) acc[h.date] = []; acc[h.date].push(h); return acc; }, {});
  const dates = Object.keys(byDate).sort().reverse();

  return (
    <div className="fu">
      <SL>SKILL EVOLUTION</SL>

      {allSkills.length > 0 && (
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:36 }}>
          {sorted.slice(0,9).map(s => (
            <div key={s.id} className="hov" style={{ border:"1px solid #444", borderRadius:5, padding:"12px 14px" }}>
              <div style={{ fontSize:11, fontWeight:"bold", marginBottom:2, lineHeight:1.3 }}>{s.name}</div>
              <div style={{ fontSize:8, color:"#f97316", marginBottom:8 }}>{s.projectName}</div>
              <LevelBar level={s.level} />
            </div>
          ))}
        </div>
      )}

      {history.length === 0 ? (
        <div style={{ textAlign:"center", padding:"40px", border:"1px dashed #555", borderRadius:7, color:"#777", fontSize:10 }}>
          No history yet. Log your first session to begin tracking evolution.
        </div>
      ) : (
        <>
          <SL>SESSION HISTORY</SL>
          <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
            {dates.map(date => (
              <div key={date}>
                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:10 }}>
                  <span style={{ fontSize:9, color:"#999" }}>{date}</span>
                  <div style={{ flex:1, height:1, background:"#3a3a3a" }} />
                  <span style={{ fontSize:9, color:"#777" }}>{byDate[date].length} skills</span>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                  {byDate[date].map((h,i) => {
                    const delta = h.levelAfter - h.levelBefore;
                    const col = delta > 0 ? "#22c55e" : delta < 0 ? "#ef4444" : "#888";
                    return (
                      <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:14, padding:"12px 16px",
                        background:"#333", border:"1px solid #444", borderRadius:5 }}>
                        <div style={{ minWidth:44, textAlign:"center" }}>
                          <div style={{ fontFamily:"'Syne',sans-serif", fontSize:18, fontWeight:900, color:col }}>{h.levelAfter}</div>
                          {delta !== 0 && <div style={{ fontSize:9, color:col }}>{delta > 0 ? "+" + delta : delta}</div>}
                        </div>
                        <div style={{ flex:1 }}>
                          <div style={{ fontSize:11, fontWeight:"bold", marginBottom:2 }}>{h.skillName}</div>
                          <div style={{ fontSize:9, color:"#f97316", marginBottom:6 }}>{h.projectName}</div>
                          {h.learned && <div style={{ fontSize:10, color:"#aaa" }}>{"◈ "}{h.learned}</div>}
                          {h.tip && <div style={{ fontSize:10, color:"#22d3ee", marginTop:4 }}>{"→ "}{h.tip}</div>}
                        </div>
                        <div style={{ fontSize:9, color:"#777" }}>{h.status}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ── Mount ─────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SkillGenome />);
</script>
</body>
